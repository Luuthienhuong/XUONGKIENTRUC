<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BỘ MÔN KIẾN TRÚC · XƯỞNG THỰC HÀNH & THIẾT KẾ KIẾN TRÚC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-serif { font-family: 'Merriweather', serif; }
  </style>
</head>
<body class="bg-[#FCFAF6] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function ArchitectureEquipmentSystem() {
      const [activeTab, setActiveTab] = useState('muon');
      const [role, setRole] = useState('giang_vien');
      const [selectedEquipments, setSelectedEquipments] = useState([]);
      const [needAssistant, setNeedAssistant] = useState(false);

      // Danh mục thiết bị chuẩn theo xưởng
      const [equipmentCatalog, setEquipmentCatalog] = useState([
        {
          category: 'CHẾ TÁC VÀ MÔ HÌNH',
          items: [
            { id: 'laser_craft', name: 'Máy cắt mô hình Laser Craft', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' }
          ]
        },
        {
          category: 'ĐO ĐẠC VÀ KIỂM TRA MÔI TRƯỜNG',
          items: [
            { id: 'lux_meter', name: 'Máy đo ánh sáng', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' },
            { id: 'wind_speed', name: 'Máy đo tốc độ gió', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' },
            { id: 'datalogger_temp_rh', name: 'Bộ ghi dữ liệu nhiệt độ, độ ẩm, áp suất', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' },
            { id: 'temp_logger', name: 'Máy đo ghi nhiệt độ', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' },
            { id: 'solar_rad', name: 'Máy đo bức xạ nhiệt độ mặt trời', disabled: true, note: 'Hư hoặc lâu không sử dụng, chưa cho mượn' },
            { id: 'sound_meter', name: 'Máy đo độ ồn', disabled: false, note: '' },
            { id: 'laser_dist', name: 'Máy đo khoảng cách laser', disabled: false, note: '' }
          ]
        },
        {
          category: 'GHI HÌNH',
          items: [
            { id: 'flycam', name: 'Máy quay Flycam', disabled: false, note: '' }
          ]
        },
        {
          category: 'DỤNG CỤ HỖ TRỢ KHÁC',
          items: [
            { id: 'color_printer', name: 'Máy in màu', disabled: false, note: '' },
            { id: 'projector', name: 'Máy chiếu', disabled: false, note: '' },
            { id: 'desktop_pc', name: 'Máy tính để bàn', disabled: false, note: '' }
          ]
        }
      ]);

      const [borrowHistory, setBorrowHistory] = useState([]);
      const [formData, setFormData] = useState({
        teacherName: '',
        subject: '',
        studentClass: '',
        usageDate: '2026-11-09',
        shift: 'Sáng',
        purpose: ''
      });

      const [propData, setPropData] = useState({
        teacherName: '',
        subject: '',
        name: '',
        category: 'Thiết bị',
        priority: 'Trung bình',
        quantity: 1,
        price: '',
        reason: '',
        url: ''
      });

      const toggleEquip = (name, disabled) => {
        if (disabled) return;
        if (selectedEquipments.includes(name)) {
          setSelectedEquipments(selectedEquipments.filter(item => item !== name));
        } else {
          setSelectedEquipments([...selectedEquipments, name]);
        }
      };

      const handleBorrowSubmit = (e) => {
        e.preventDefault();
        if (role === 'sinh_vien') {
          alert('Chỉ Giảng viên mới có quyền đăng ký mượn thiết bị!');
          return;
        }
        if (selectedEquipments.length === 0) {
          alert('Vui lòng chọn ít nhất 1 thiết bị cần dùng!');
          return;
        }

        const newRecord = {
          id: Date.now(),
          teacherName: formData.teacherName,
          subject: formData.subject,
          studentClass: formData.studentClass,
          date: formData.usageDate,
          shift: formData.shift,
          equipments: [...selectedEquipments],
          needAssistant: needAssistant,
          status: 'Chờ duyệt'
        };

        setBorrowHistory([newRecord, ...borrowHistory]);
        alert('Đã gửi phiếu đăng ký sử dụng thiết bị thành công!');
        setSelectedEquipments([]);
      };

      const handleProposalSubmit = (e) => {
        e.preventDefault();
        alert('Đã gửi đề xuất mua sắm cho bộ môn thành công!');
        setPropData({
          teacherName: '',
          subject: '',
          name: '',
          category: 'Thiết bị',
          priority: 'Trung bình',
          quantity: 1,
          price: '',
          reason: '',
          url: ''
        });
      };

      return (
        <div className="min-h-screen py-10 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
          {/* Header */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-5 border-b border-[#E6E1D8] gap-4">
            <div>
              <p className="text-[11px] tracking-widest font-semibold text-stone-500 uppercase">
                BỘ MÔN KIẾN TRÚC · XƯỞNG THỰC HÀNH & THIẾT KẾ KIẾN TRÚC
              </p>
              <h1 className="text-3xl font-bold text-[#142A38] mt-1">
                Đăng ký thiết bị và đề xuất mua sắm
              </h1>
              <p className="text-stone-600 text-sm mt-1">
                Giảng viên đăng ký lịch dùng thiết bị trước mỗi buổi thực hành, hoặc gửi gợi ý thiết bị, phần mềm cần mua cho học phần của mình.
              </p>
              <p className="text-xs text-stone-400 mt-2">
                {role === 'admin' 
                  ? 'Bạn đang xem với quyền quản lý: có nút Xác nhận, Từ chối, Xóa và tải CSV.' 
                  : 'Bạn đang xem với quyền đăng ký học phần.'}
              </p>
            </div>

            {/* Chuyển đổi vai trò người xem */}
            <div className="bg-[#F3EFE6] border border-[#DDD6C8] rounded-lg p-2 text-xs">
              <span className="font-semibold block text-stone-700 mb-1">Chế độ người dùng:</span>
              <select 
                value={role} 
                onChange={(e) => setRole(e.target.value)}
                className="bg-white border border-stone-300 rounded px-2 py-1 font-medium text-slate-700 outline-none"
              >
                <option value="giang_vien">Giảng viên (Được đăng ký)</option>
                <option value="admin">Quản trị viên (Duyệt/Xóa)</option>
                <option value="sinh_vien">Sinh viên (Chỉ xem lịch)</option>
              </select>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex gap-8 border-b border-[#E6E1D8] mt-4 mb-7 text-sm font-semibold">
            <button
              onClick={() => setActiveTab('muon')}
              className={`pb-3 transition-colors ${activeTab === 'muon' ? 'text-[#1E4E68] border-b-2 border-[#1E4E68]' : 'text-stone-500 hover:text-stone-800'}`}
            >
              Đăng ký mượn thiết bị
            </button>
            <button
              onClick={() => setActiveTab('dexuat')}
              className={`pb-3 transition-colors ${activeTab === 'dexuat' ? 'text-[#1E4E68] border-b-2 border-[#1E4E68]' : 'text-stone-500 hover:text-stone-800'}`}
            >
              Đề xuất mua sắm
            </button>
          </div>

          {/* TAB 1: FORM MƯỢN THIẾT BỊ */}
          {activeTab === 'muon' && (
            <div>
              {role === 'sinh_vien' ? (
                <div className="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded text-sm mb-6">
                  Trang web chỉ cho phép giảng viên gửi đơn mượn thiết bị. Sinh viên xem lịch đăng ký bên dưới.
                </div>
              ) : (
                <form onSubmit={handleBorrowSubmit} className="space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Họ tên giảng viên</label>
                      <input 
                        type="text" 
                        required
                        value={formData.teacherName}
                        onChange={(e) => setFormData({...formData, teacherName: e.target.value})}
                        className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none focus:border-[#1E4E68]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Học phần</label>
                      <input 
                        type="text" 
                        required
                        placeholder="Ví dụ: Vật lý kiến trúc 2"
                        value={formData.subject}
                        onChange={(e) => setFormData({...formData, subject: e.target.value})}
                        className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none focus:border-[#1E4E68]"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Lớp</label>
                    <input 
                      type="text" 
                      placeholder="Ví dụ: 24KT1"
                      value={formData.studentClass}
                      onChange={(e) => setFormData({...formData, studentClass: e.target.value})}
                      className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none focus:border-[#1E4E68]"
                    />
                  </div>

                  {/* Danh mục thiết bị */}
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      Thiết bị cần dùng <span className="font-normal text-stone-500">(chọn một hoặc nhiều)</span>
                    </label>
                    <div className="p-3 bg-[#F4EFE6] border-l-4 border-amber-600 text-xs text-stone-700 mb-4">
                      Một số thiết bị đang hư hoặc lâu không sử dụng nên chưa thể đăng ký (các ô màu xám). Nếu học phần của thầy cô cần dùng hoặc cần sửa chữa, thay thế các thiết bị này, xin gửi ở tab Đề xuất mua sắm.
                    </div>

                    <div className="space-y-4">
                      {equipmentCatalog.map((cat, idx) => (
                        <div key={idx}>
                          <h4 className="text-[11px] font-bold text-stone-500 uppercase tracking-wider mb-2">{cat.category}</h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                            {cat.items.map((item) => (
                              <div
                                key={item.id}
                                onClick={() => toggleEquip(item.name, item.disabled)}
                                className={`p-3 rounded border text-xs flex items-start gap-2.5 transition-all ${
                                  item.disabled 
                                    ? 'bg-[#EFECE6] border-stone-300 opacity-80 cursor-not-allowed'
                                    : selectedEquipments.includes(item.name)
                                      ? 'bg-blue-50/60 border-[#1E4E68] shadow-sm cursor-pointer'
                                      : 'bg-[#FDFCFA] border-stone-200 hover:border-stone-300 cursor-pointer'
                                }`}
                              >
                                <input 
                                  type="checkbox"
                                  disabled={item.disabled}
                                  checked={selectedEquipments.includes(item.name)}
                                  onChange={() => {}}
                                  className="mt-0.5 rounded text-[#1E4E68]"
                                />
                                <div>
                                  <span className={`block font-medium ${item.disabled ? 'text-stone-700' : 'text-slate-800'}`}>
                                    {item.name}
                                  </span>
                                  {item.disabled && (
                                    <span className="text-[11px] text-[#8C5E28] block mt-1 leading-snug">
                                      {item.note}
                                    </span>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Ngày & Buổi */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Ngày sử dụng</label>
                      <input 
                        type="date" 
                        value={formData.usageDate}
                        onChange={(e) => setFormData({...formData, usageDate: e.target.value})}
                        className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Buổi</label>
                      <select 
                        value={formData.shift}
                        onChange={(e) => setFormData({...formData, shift: e.target.value})}
                        className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                      >
                        <option value="Sáng">Sáng</option>
                        <option value="Chiều">Chiều</option>
                        <option value="Cả ngày">Cả ngày</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Nội dung sử dụng</label>
                    <textarea 
                      rows="3"
                      placeholder="Bài thực hành, số sinh viên, địa điểm dùng thiết bị"
                      value={formData.purpose}
                      onChange={(e) => setFormData({...formData, purpose: e.target.value})}
                      className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none focus:border-[#1E4E68]"
                    ></textarea>
                  </div>

                  <div className="p-3 border border-stone-200 rounded bg-[#FDFCFA]">
                    <label className="flex items-center gap-2 text-xs text-stone-700 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={needAssistant}
                        onChange={(e) => setNeedAssistant(e.target.checked)}
                        className="rounded"
                      />
                      Cần trưởng xưởng hướng dẫn hoặc hỗ trợ kỹ thuật tại buổi dùng
                    </label>
                  </div>

                  <button 
                    type="submit"
                    className="bg-[#2B5B75] text-white px-5 py-2.5 rounded font-medium text-sm hover:bg-[#1E4357] transition-all"
                  >
                    Gửi đăng ký
                  </button>
                </form>
              )}

              {/* Lịch đăng ký chung */}
              <div className="mt-12">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-xl font-bold font-serif text-[#142A38]">Lịch đăng ký chung</h3>
                  <button 
                    onClick={() => alert('Xuất danh sách đăng ký mượn ra file CSV...')}
                    className="border border-stone-300 bg-white px-3 py-1 rounded text-xs font-medium text-slate-700 hover:bg-stone-50"
                  >
                    Tải bảng CSV
                  </button>
                </div>

                {borrowHistory.length === 0 ? (
                  <div className="border border-dashed border-[#DDD6C8] bg-[#F7F4ED] rounded-lg p-6 text-center text-xs text-stone-500">
                    Chưa có đăng ký nào. Đăng ký mới hiện ở đây để mọi người xem lịch dùng thiết bị.
                  </div>
                ) : (
                  <div className="bg-white border border-stone-200 rounded-lg overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#F7F4ED] border-b border-stone-200 text-stone-600 font-bold">
                        <tr>
                          <th className="p-3">Giảng viên / Lớp</th>
                          <th className="p-3">Học phần</th>
                          <th className="p-3">Thời gian</th>
                          <th className="p-3">Thiết bị mượn</th>
                          <th className="p-3">Trạng thái</th>
                          {role === 'admin' && <th className="p-3 text-right">Thao tác</th>}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100">
                        {borrowHistory.map((item) => (
                          <tr key={item.id}>
                            <td className="p-3 font-medium text-slate-800">
                              {item.teacherName} {item.studentClass && `(${item.studentClass})`}
                            </td>
                            <td className="p-3">{item.subject}</td>
                            <td className="p-3">{item.date} ({item.shift})</td>
                            <td className="p-3">
                              <span className="text-blue-900 bg-blue-50 px-2 py-0.5 rounded font-medium">
                                {item.equipments.join(', ')}
                              </span>
                            </td>
                            <td className="p-3 font-semibold text-amber-700">{item.status}</td>
                            {role === 'admin' && (
                              <td className="p-3 text-right space-x-1">
                                <button 
                                  onClick={() => setBorrowHistory(borrowHistory.map(b => b.id === item.id ? {...b, status: 'Đã xác nhận'} : b))}
                                  className="px-2 py-1 bg-emerald-600 text-white rounded"
                                >
                                  Duyệt
                                </button>
                                <button 
                                  onClick={() => setBorrowHistory(borrowHistory.filter(b => b.id !== item.id))}
                                  className="px-2 py-1 bg-stone-200 text-stone-700 rounded"
                                >
                                  Xóa
                                </button>
                              </td>
                            )}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: ĐỀ XUẤT MUA SẮM */}
          {activeTab === 'dexuat' && (
            <form onSubmit={handleProposalSubmit} className="space-y-5">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Họ tên giảng viên</label>
                  <input 
                    type="text" 
                    required
                    value={propData.teacherName}
                    onChange={(e) => setPropData({...propData, teacherName: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Học phần liên quan</label>
                  <input 
                    type="text" 
                    required
                    value={propData.subject}
                    onChange={(e) => setPropData({...propData, subject: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">Thiết bị hoặc phần mềm đề xuất</label>
                <input 
                  type="text" 
                  required
                  placeholder="Tên thiết bị, phần mềm hoặc học liệu"
                  value={propData.name}
                  onChange={(e) => setPropData({...propData, name: e.target.value})}
                  className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none mb-2"
                />
                
                {/* Các nút bấm chọn nhanh */}
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {[
                    'Máy in 3D', 'PC cấu hình rất cao', 'Kính thực tế ảo (VR)', 'Máy in A3 và photocopy', 
                    'Máy scan 3D cầm tay', 'Máy GPS cầm tay', 'Phần mềm GIS (QGIS, ArcGIS)', 
                    'Phần mềm Ladybug, ClimateStudio', 'Máy đo độ rọi (Lux meter)', 'Bàn đo bóng nắng Heliodon'
                  ].map((sug, i) => (
                    <button
                      key={i}
                      type="button"
                      onClick={() => setPropData({...propData, name: sug})}
                      className="text-xs bg-[#EFECE6] hover:bg-[#E5E1D8] text-stone-700 px-2.5 py-1 rounded border border-stone-300 transition-colors"
                    >
                      {sug}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Loại</label>
                  <select 
                    value={propData.category}
                    onChange={(e) => setPropData({...propData, category: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  >
                    <option value="Thiết bị">Thiết bị</option>
                    <option value="Phần mềm">Phần mềm</option>
                    <option value="Khác">Khác</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Mức ưu tiên</label>
                  <select 
                    value={propData.priority}
                    onChange={(e) => setPropData({...propData, priority: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  >
                    <option value="Trung bình">Trung bình</option>
                    <option value="Cao">Cao</option>
                    <option value="Thấp">Thấp</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Số lượng</label>
                  <input 
                    type="number" 
                    min="1"
                    value={propData.quantity}
                    onChange={(e) => setPropData({...propData, quantity: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Giá tham khảo (nếu có)</label>
                  <input 
                    type="text" 
                    placeholder="Ví dụ: 25 triệu đồng"
                    value={propData.price}
                    onChange={(e) => setPropData({...propData, price: e.target.value})}
                    className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">Lý do và nội dung giảng dạy sử dụng</label>
                <textarea 
                  rows="3"
                  placeholder="Thiết bị hỗ trợ bài tập hoặc nội dung nào của học phần"
                  value={propData.reason}
                  onChange={(e) => setPropData({...propData, reason: e.target.value})}
                  className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">Đường dẫn sản phẩm hoặc thông số (nếu có)</label>
                <input 
                  type="url" 
                  value={propData.url}
                  onChange={(e) => setPropData({...propData, url: e.target.value})}
                  className="w-full px-3 py-2 border border-stone-300 rounded bg-[#FDFCFA] text-sm outline-none"
                />
              </div>

              <button 
                type="submit"
                className="bg-[#2B5B75] text-white px-5 py-2.5 rounded font-medium text-sm hover:bg-[#1E4357] transition-all"
              >
                Gửi đề xuất
              </button>
            </form>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ArchitectureEquipmentSystem />);
  </script>
</body>
</html>
